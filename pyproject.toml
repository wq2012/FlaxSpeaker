[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flaxspeaker"
version = "0.4.0"
description = "A modernized, research- and production-ready speaker recognition library in JAX and Flax."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Quan Wang", email = "quanw@google.com"},
]
# Single source of truth for runtime dependencies (setup.py defers to this file).
# Lower bounds are the oldest releases exercised by the test-suite / CI matrix;
# the released wheel was built and smoke-tested with the versions listed in
# CHANGELOG.md (0.4.0).
dependencies = [
    "numpy>=1.26",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "flax>=0.8.0",
    "optax>=0.2.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "munch>=2.5",
    "transformers>=4.36.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/wq2012/FlaxSpeaker"
Repository = "https://github.com/wq2012/FlaxSpeaker"
"Hugging Face Models Collection" = "https://huggingface.co/collections/wq2012/flaxspeaker"
"Bug Tracker" = "https://github.com/wq2012/FlaxSpeaker/issues"

[project.optional-dependencies]
export = ["tensorflow>=2.15", "ai-edge-litert>=1.0"]
demo = ["gradio>=4.0"]
# Kept for backwards compatibility: these are already core dependencies.
hf = ["safetensors>=0.4.0", "huggingface-hub>=0.20.0", "transformers>=4.36.0"]
dev = ["pytest", "pytest-cov", "flake8", "pytype", "pdoc", "build", "twine"]

[project.scripts]
flaxspeaker = "flaxspeaker.__main__:main"

[tool.setuptools.packages.find]
include = ["flaxspeaker", "flaxspeaker.*"]
