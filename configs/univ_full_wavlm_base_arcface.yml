data:
  dataset_type: librispeech
  dataset_name: universal_full
  train_dir: ''
  test_dir: ''
  train_librispeech_dir: ''
  test_librispeech_dir: ''
  train_csv: ''
  test_csv: ''
  trials_file: ''
  sharded_cache_dir: ''
  musan_dir: ''
  rirs_dir: ''
  speed_perturb: false
  speed_factors:
  - 1.0
  - 0.9
  - 1.1
  audio_format: .flac
  speaker_label_index: -2
  within_domain_prob: 0.75
  domain_temp_alpha: 0.35
vad:
  enabled: false
  mode: none
  sample_rate: 16000
  frame_size_ms: 25.0
  frame_step_ms: 10.0
  apply_agc: true
  energy_threshold_db: -42.0
  energy_db_threshold: 26.0
  adaptive_percentile: 10.0
  snr_margin_db: 4.5
  spectral_flatness_threshold: 0.65
  min_speech_frames: 3
  hangover_frames: 8
frontend:
  feature_type: log_mel
  sample_rate: 16000
  n_mfcc: 80
  n_mels: 80
  frame_size_ms: 25.0
  frame_step_ms: 10.0
  n_fft: 512
  fmin: 20.0
  fmax: 7600.0
  preemph: 0.97
  log_offset: 1.0e-06
  apply_cmvn: true
  cmvn_norm_vars: false
  stack_left_context: 0
  stack_right_context: 0
  frame_stride: 1
  kaldi_fbank: true
  hf_extractor_name: openai/whisper-tiny
model:
  backbone: wavlm
  size_variant: large
  embedding_dim: 256
  normalize_embedding: true
  n_mfcc: 80
  seq_len: 200
  min_seq_len: 80
  max_seq_len: 200
  max_eval_seq_len: 0
  variable_length_training: true
  sliding_window_step: 50
  full_sequence_inference: true
  scoring_type: cosine
  saved_model_path: ''
  lstm:
    hidden_size: 512
    proj_size: 0
    num_layers: 5
    bidirectional: false
    use_layer_norm: true
    frame_aggregation_mean: true
  transformer:
    dim: 384
    num_encoder_layers: 6
    num_heads: 6
    mlp_dim: 1536
    use_positional_encoding: false
    use_conv_stem: true
  conformer:
    dim: 320
    num_layers: 4
    num_heads: 8
    ffn_dim: 640
    conv_kernel_size: 15
    subsample_factor: 1
    subsample_after_layer: 4
    layer_order: mhsa_before_conv
    use_group_norm: true
    use_conv_stem: true
    use_positional_encoding: false
    normalize_output: false
    resnet_stem_channels: 0
  mamba:
    dim: 384
    num_layers: 6
    d_state: 16
    d_conv: 4
    expand_factor: 2
    dt_rank: 16
    bidirectional: false
  ecapa_tdnn:
    channels: 1024
    scale: 8
    kernel_sizes:
    - 5
    - 3
    - 3
    - 3
    dilations:
    - 1
    - 2
    - 3
    - 4
    se_bottleneck_dim: 128
    mfa_dim: 1536
    use_batch_norm: true
    norm_after_activation: true
    freq_resnet_channels: 0
  resnet:
    base_channels: 48
    num_blocks:
    - 3
    - 4
    - 6
    - 3
    use_se: true
    out_dim: 384
    use_batch_norm: true
    wespeaker_mode: false
  wavlm:
    dim: 768
    num_layers: 12
    num_heads: 12
    ffn_dim: 3072
    num_buckets: 320
    max_distance: 800
    pos_conv_kernel: 128
    pos_conv_groups: 16
    subsample_factor: 2
    tdnn_dim: 512
    tdnn_out_dim: 1500
    acoustic_resnet_channels: 64
  pooling:
    pooling_type: stats
    attention_dim: 128
    use_global_context: true
    stats_type: MEAN_STD
    num_heads: 4
    subspace_heads: true
    epsilon: 0.0001
    bottleneck_dim: 256
    use_nonlinear_bottleneck: false
    use_bottleneck_ln: false
    asp_relu_bn: false
    unbiased_std: true
  pfas:
    num_keys: 4
    key_dim: 32
    value_dim: 128
    attention_dim: 128
    attention_type: shared_nonlinear
    attention_weight_mode: exp
    atp_ffn_use_layer_norm: true
    scale_factor: 16.0
    temperature: 0.0
    use_trainable_scale_factor: true
    normalize_keys_and_values: false
    normalize_overall_output: false
    per_trial_softmax: true
    apply_l2_norm_to_keys: true
    apply_l2_norm_to_values: false
    apply_global_l2_norm_to_concat_form: true
    apply_softmax_per_test_key: false
    use_global_anchor: true
    use_stats_global_anchor: false
    local_value_scale: 0.25
  dr_vector:
    hidden_dims:
    - 128
    - 64
    activation: relu
    leaky_relu_slope: 0.2
    use_layer_norm: true
    include_cosine_in_input: true
    residual_weight: 0.25
    add_cosine_to_network_output: true
    append_cosine_as_feature_to_network_input: true
    append_cosine_to_final_hidden: false
    num_cosine_terms: 1
    symmetric_input: false
    cosine_dims: 0
    readout: linear
    trainable_affine: false
loss:
  loss_type: subcenter_arcface
  scoring_type: cosine
  num_speakers_per_batch: 8
  num_utts_per_speaker: 4
  triplet_alpha: 0.1
  ge2e_learn_wb: true
  ge2e_init_w: 10.0
  ge2e_init_b: -5.0
  ge2e_split_batch: false
  ge2e_exact_leave_one_out: true
  ge2e_contrast_surrogate: false
  ge2e_contrast_b_grad_scale: 0.0
  multi_row_window: 0
  pure_extended_set: false
  ext_softmax_normalize_by_num_speakers: true
  ext_softmax_row_softmax_weight: 0.5
  scale: 32.0
  margin: 0.3
  subcenter_k: 3
  sphereface_m: 1.35
  sphereface_lambda_min: 5.0
  sphereface_lambda_base: 1000.0
  sphereface_lambda_gamma: 0.12
  sphereface_lambda_power: 1.0
  margin_warmup_steps: 0
train:
  batch_size: 32
  num_spks_per_batch: 8
  num_utts_per_spk: 4
  triplet_alpha: 0.1
  learning_rate: 0.001
  min_learning_rate: 1.0e-05
  optimizer: adamw
  sgd_momentum: 0.9
  nesterov: true
  weight_decay: 0.0001
  warmup_steps: 50
  lr_schedule_cosine: true
  grad_clip_norm: 3.0
  ge2e_grad_scale: 0.01
  init_from_checkpoint: ''
  freeze_trunk: false
  trunk_lr_mult: 1.0
  save_model_frequency: 500
  num_steps: 500
  num_processes: 4
  seed: 42
  saved_model_dir: ''
  specaug:
    use_specaug: true
    apply_prob: 0.5
    freq_mask_prob: 0.5
    time_mask_prob: 0.5
    freq_mask_max_width: 8
    time_mask_max_width: 12
    num_freq_masks: 2
    num_time_masks: 2
    gaussian_noise_std: 0.0
  waveform_aug:
    enabled: true
    use_waveform_aug: true
    aug_prob: 0.35
    snr_min_db: 12.0
    snr_max_db: 20.0
    reverb_prob: 0.4
    reverb_rt60_min: 0.05
    reverb_rt60_max: 0.2
    musan_dir: ''
    rirs_dir: ''
    noise_snr_range:
    - 0.0
    - 15.0
    music_snr_range:
    - 5.0
    - 15.0
    babble_snr_range:
    - 13.0
    - 20.0
    babble_spk_range:
    - 3
    - 7
  loss:
    loss_type: subcenter_arcface
    scoring_type: cosine
    num_speakers_per_batch: 8
    num_utts_per_speaker: 4
    triplet_alpha: 0.1
    ge2e_learn_wb: true
    ge2e_init_w: 10.0
    ge2e_init_b: -5.0
    ge2e_split_batch: false
    ge2e_exact_leave_one_out: true
    ge2e_contrast_surrogate: false
    ge2e_contrast_b_grad_scale: 0.0
    multi_row_window: 0
    pure_extended_set: false
    ext_softmax_normalize_by_num_speakers: true
    ext_softmax_row_softmax_weight: 0.5
    scale: 32.0
    margin: 0.3
    subcenter_k: 3
    sphereface_m: 1.35
    sphereface_lambda_min: 5.0
    sphereface_lambda_base: 1000.0
    sphereface_lambda_gamma: 0.12
    sphereface_lambda_power: 1.0
    margin_warmup_steps: 0
eval:
  full_sequence_inference: true
  max_eval_frames_cap: 768
  num_triplets: 1000
  threshold_step: 0.001
  num_enroll_utts: 1
  use_as_norm: false
  apply_as_norm: false
  as_norm_top_k: 300
  as_norm_cohort_size: 300
  use_qmf: false
  dcf_c_miss: 1.0
  dcf_c_fa: 1.0
export:
  output_dir: exported_model
  export_tflite: true
  sequence_length: 180
