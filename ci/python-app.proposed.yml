# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytype build
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Check pytype
      run: |
        pytype .
    - name: Lint with flake8
      run: |
        flake8 .
    - name: Test with pytest
      run: |
        pytest tests.py
    - name: Build wheel
      run: |
        python -m build
    - name: Smoke-test the built wheel in a clean virtualenv
      run: |
        python -m venv /tmp/wheel_venv
        /tmp/wheel_venv/bin/python -m pip install --upgrade pip
        /tmp/wheel_venv/bin/python -m pip install dist/flaxspeaker-*.whl
        cd /tmp && /tmp/wheel_venv/bin/python -c "import flaxspeaker; from flaxspeaker import load_pretrained; print(flaxspeaker.__version__)"
