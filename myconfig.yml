---
# Default FlaxSpeaker v0.5.0 experiment configuration.

data:
  train_librispeech_dir: "testdata/LibriSpeech/train-clean-100"
  test_librispeech_dir: "testdata/LibriSpeech/test-clean"
  train_csv: ""
  test_csv: ""
  trials_file: ""

frontend:
  feature_type: "log_mel"
  sample_rate: 16000
  n_mels: 80
  apply_cmvn: true

vad:
  enabled: true
  mode: "energy"
  min_speech_frames: 10

model:
  backbone: "conformer"
  size_variant: "small"
  embedding_dim: 192
  seq_len: 180
  min_seq_len: 90
  max_eval_seq_len: 0
  variable_length_training: true
  sliding_window_step: 90
  saved_model_path: "saved_model/flax_model.msgpack"
  pooling:
    pooling_type: "atp"
    num_heads: 4
    attention_dim: 128
    stats_type: "MEAN_STD"

train:
  batch_size: 32
  learning_rate: 0.001
  optimizer: "adamw"
  weight_decay: 0.0001
  num_steps: 2400
  save_model_frequency: 500
  seed: 42
  loss:
    loss_type: "subcenter_arcface"
    scoring_type: "cosine"
    scale: 30.0
    margin: 0.2
    subcenter_k: 3
    margin_warmup_steps: 300
  specaug:
    use_specaug: true
    freq_mask_prob: 0.5
    time_mask_prob: 0.5
    freq_mask_max_width: 10
    time_mask_max_width: 20

eval:
  full_sequence_inference: true
  use_as_norm: false
  as_norm_top_k: 300
  as_norm_cohort_size: 300
  use_qmf: false
  max_eval_frames_cap: 3000
  num_triplets: 1000
  threshold_step: 0.001
